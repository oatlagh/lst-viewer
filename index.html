<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LST Viewer">
<meta name="theme-color" content="#1f4e8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>LST Viewer</title>
<style>
:root{--ink:#1a1d21;--quiet:#5a616a;--accent:#1f4e8c;--line:#d0d5db;--bg:#e9ecef;--err:#b3261e}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,system-ui,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.logo{width:44px;height:44px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center}
h1{margin:0;font-size:22px}p{margin:0;color:var(--quiet);font-size:14px;line-height:1.5}
label{font-size:13px;font-weight:600}
input[type=password]{width:100%;height:48px;border:1px solid #c3c9d0;border-radius:10px;padding:0 12px;font-size:17px}
.row{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:400}.row input{width:20px;height:20px;accent-color:var(--accent)}
button{height:48px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;font-weight:600}
button:disabled{opacity:.6}
.msg{font-size:14px;min-height:20px}.msg.err{color:var(--err)}
.bar{height:6px;background:#eef0f2;border-radius:3px;overflow:hidden}.bar div{height:100%;width:0;background:var(--accent);transition:width .2s}
.foot{font-size:12px;color:#8a9099}
.hidden{display:none!important}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <div class="logo"><svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" aria-hidden="true"><path d="M2 12h12M2 8h12M5 4v8M11 4v8"/></svg></div>
  <h1>LST Viewer</h1>
  <p id="info">Die App ist verschlüsselt. Mit deinem Passwort wird sie nur auf diesem Gerät entschlüsselt.</p>
  <div id="ask" class="hidden" style="display:flex;flex-direction:column;gap:12px">
    <label for="pw">Passwort</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <label class="row"><input id="remember" type="checkbox" checked> Auf diesem Gerät merken (für Updates)</label>
    <button id="go" type="submit">Entsperren</button>
  </div>
  <div class="bar hidden" id="bar"><div></div></div>
  <div class="msg" id="msg"></div>
  <div class="foot" id="foot"></div>
</form>
<script>
(async function () {
  'use strict';
  const $ = s => document.querySelector(s);
  const msg = (t, err) => { $('#msg').textContent = t; $('#msg').className = 'msg' + (err ? ' err' : ''); };
  const prog = p => { $('#bar').classList.toggle('hidden', p == null); if (p != null) $('#bar div').style.width = Math.round(p * 100) + '%'; };
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const BASE = new URL('./', location.href).href;
  const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };

  if (!('serviceWorker' in navigator) || !window.crypto?.subtle) { msg('Dieser Browser unterstützt die App nicht (Safari ab iOS 16 nötig).', true); return; }

  // Schlüsselablage (nicht exportierbarer CryptoKey in IndexedDB)
  const idb = () => new Promise((res, rej) => { const r = indexedDB.open('lst-loader', 1); r.onupgradeneeded = () => r.result.createObjectStore('keys'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const keyGet = async salt => { try { const d = await idb(); return await new Promise(res => { const q = d.transaction('keys').objectStore('keys').get(salt); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (e) { return null; } };
  const keyPut = async (salt, k) => { try { const d = await idb(); await new Promise(res => { const t = d.transaction('keys', 'readwrite'); t.objectStore('keys').clear(); t.objectStore('keys').put(k, salt); t.oncomplete = res; t.onerror = res; }); } catch (e) {} };
  const keyClear = async () => { try { const d = await idb(); await new Promise(res => { const t = d.transaction('keys', 'readwrite'); t.objectStore('keys').clear(); t.oncomplete = res; t.onerror = res; }); } catch (e) {} };

  // ?sperren → entschlüsselte App und gemerkten Schlüssel von diesem Gerät entfernen
  if (new URLSearchParams(location.search).has('sperren')) { await caches.delete('lst-app'); await keyClear(); ls.del('lst-app-version'); msg('App gesperrt. Zum Entsperren Passwort eingeben.'); }

  msg('Starte …');
  try {
    await navigator.serviceWorker.register('loader-sw.js');
    const ok = await Promise.race([navigator.serviceWorker.ready.then(() => true), new Promise(r => setTimeout(() => r(false), 10000))]);
    if (!ok) { msg('Start dauert zu lange – bitte Seite neu laden. Fehlt eine Datei (loader-sw.js)?', true); return; }
  } catch (e) { msg('Service Worker konnte nicht starten: ' + e.message, true); return; }
  if (!navigator.serviceWorker.controller) { location.reload(); return; }  // erster Start: Seite einmal unter Kontrolle des SW neu laden
  if ($('#msg').textContent === 'Starte …') msg('');

  const installed = ls.get('lst-app-version');
  const hasApp = !!(await (await caches.open('lst-app')).match(BASE + 'app/index.html'));
  let meta = null;
  try { const r = await fetch('bundle.json', { cache: 'no-store' }); if (r.ok) meta = await r.json(); } catch (e) {}
  const openApp = () => location.replace(BASE + 'app/index.html');
  if (hasApp && (!meta || meta.version === installed)) return openApp();          // aktuell oder offline
  if (!meta) { msg('Keine Verbindung und noch keine App auf diesem Gerät. Bitte einmal mit Internet öffnen.', true); return; }
  $('#foot').textContent = `Paket ${meta.version} · ${(meta.size / 1048576).toFixed(1).replace('.', ',')} MB` + (hasApp ? ' · Update verfügbar' : '');

  async function unlock(key) {
    prog(0.05); msg('Lade Paket …');
    const r = await fetch('bundle.enc', { cache: 'no-store' }); if (!r.ok) throw new Error('Paket nicht abrufbar (' + r.status + ')');
    const total = +r.headers.get('content-length') || meta.size; const reader = r.body.getReader(); const parts = []; let got = 0;
    for (;;) { const { done, value } = await reader.read(); if (done) break; parts.push(value); got += value.length; prog(0.05 + 0.6 * Math.min(1, got / total)); }
    const enc = new Uint8Array(got); let o = 0; for (const p of parts) { enc.set(p, o); o += p.length; }
    msg('Entschlüssele …'); prog(0.7);
    const plain = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(meta.iv) }, key, enc));
    const hl = new DataView(plain.buffer).getUint32(0, true); const header = JSON.parse(new TextDecoder().decode(plain.subarray(4, 4 + hl))); const data = plain.subarray(4 + hl);
    await caches.delete('lst-app'); const c = await caches.open('lst-app');
    let i = 0; for (const f of header) { await c.put(BASE + 'app/' + f.p, new Response(data.slice(f.o, f.o + f.l), { headers: { 'Content-Type': f.ct } })); if (++i % 5 === 0) prog(0.7 + 0.3 * i / header.length); }
    ls.set('lst-app-version', meta.version); prog(1); msg('Fertig.');
  }

  // gemerkter Schlüssel → Update ohne Passwort
  const saved = await keyGet(meta.salt);
  if (saved) { try { await unlock(saved); return openApp(); } catch (e) { await keyClear(); prog(null); } }

  $('#ask').classList.remove('hidden'); $('#pw').focus();
  $('#f').addEventListener('submit', async ev => {
    ev.preventDefault(); $('#go').disabled = true; msg('Prüfe Passwort …');
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode($('#pw').value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(meta.salt), iterations: meta.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      await unlock(key);
      if ($('#remember').checked) await keyPut(meta.salt, key);
      openApp();
    } catch (e) { prog(null); $('#go').disabled = false; msg(e.name === 'OperationError' ? 'Passwort falsch.' : 'Fehler: ' + e.message, true); }
  });
})();
</script>
</body>
</html>
